# The pinned tool environment: every tool the recipes run that is not a commit hook.
# Generated; propose changes in an issue rather than editing this file.
#
# A separate project, so these versions stay out of the project's resolution and run on
# interpreters the project does not support. Versions in force are uv.lock's; `just tools-upgrade`
# regenerates it. Tools that run inside the project's environment (slotscheck, deptry) are in its
# `lint` dependency group, and linters with a commit hook are pinned in `.pre-commit-config.yaml`.
[project]
name = "tools"
version = "0"
# The toolbox's own interpreter, independent of the project's. One minor version: uv picks the
# interpreter from this line alone.
requires-python = "==3.14.*"
dependencies = [
    # --- Type checkers ---
    # mypy gates the owned code; all four gate `typing_tests/` (`types-api`); ty, pyrefly and
    # basedpyright are informational over the packages (`types-info`).
    "ty >=0.0.95",
    "basedpyright >=1.40.2",
    "mypy >=2.4.1",
    "pyrefly >=1.4.0",

    # --- The conventions ---
    # `conventions/` is this project's package, installed as the `conventions` command. `checks/`
    # holds the repository's own rules as pytest files. Both run here, not in the project's suite.
    "click >=8.2",
    # PEP 440 versions and requirements.
    "packaging >=24",
    "pytest >=9.2",

    # --- Test sessions ---
    # Sessions use uv environments under `.nox/`, never this one.
    "nox >=2026.10.20",

    # --- Structure ---
    "import-linter >=2.13",
    "vulture >=2.14",

    # --- API surface ---
    "griffe >=2.4", # the sealing rules read a dependency's classes; mkdocstrings' parser

    # --- Docs ---
    # 0.0.67 is the first to write llms.txt.
    "zensical >=0.0.67",
    "mkdocstrings[python] >=0.27", # API reference autogen (via zensical's compat shim)
    # A member without a docstring shows its base's, in the reference and in CON916.
    "griffe-inherited-docstrings >=1.1",
]

[project.scripts]
conventions = "conventions._cli:main"
# Runs a tool with the workspace's files, distributions, interpreter and floor; see
# `conventions/_toolbox.py`.
toolbox = "conventions._toolbox:main"

# `checks/` and the scripts beside the packages are not built.
[build-system]
requires = ["uv_build >=0.12.21, <0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["conventions", "mdautolink"]
module-root = ""

[tool.uv]
package = true
default-groups = ["mdautolink"]

# `mdautolink/`, a Python-Markdown extension the docs build loads, with its own requirements.
[dependency-groups]
mdautolink = ["griffe >=1.5", "markdown >=3.6"]

# ruff finds this config by walking up from each file under tools/: 100 columns and a reduced rule
# set, with `T20`, `S`, `PTH`, `PL` and `TRY` off because scripts here print and call subprocesses.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true


# The checks run with `-c tools/pyproject.toml`: the project's `[tool.pytest.ini_options]` names
# options of plugins the toolbox lacks, which pytest reports as unknown. The path is on the command
# line because `testpaths` resolves against a rootdir this file does not fix.
[tool.pytest.ini_options]
python_files = ["*_check.py"]
