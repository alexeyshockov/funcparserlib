# pyrefly's configuration.
# Generated; propose changes in an issue rather than editing this file.
#
# pyrefly is a second opinion over the packages (`just types-info`) and gates the `typing_tests/`
# suites with the other checkers (`just types-api`); mypy gates the owned code, configured in
# `mypy.ini`. Without this file pyrefly imports `mypy.ini` as a one-off
# migration and maps `strict` to its annotation-presence rules, which `mypy.ini` opts out of.
#
# The `default` preset: correctness diagnostics without annotation-presence or implicit-`Any` rules.
# No `python-version`: the recipes pass `--python-version` from `requires-python`, and run a file
# ruff's `per-file-target-version` pins apart, at its version.
preset = "default"
project-includes = [
    "funcparserlib",
    "examples",
]
