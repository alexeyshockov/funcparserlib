# pyrefly's configuration.
# Generated; propose changes in an issue rather than editing this file.
#
# Without this file pyrefly imports `mypy.ini` and maps `strict` to annotation-presence rules, which
# `mypy.ini` opts out of. The `default` preset has no annotation-presence or implicit-`Any` rules.
# No `python-version`: the recipes pass `--python-version` from `requires-python` and run a file
# ruff's `per-file-target-version` pins apart, at its version.
preset = "default"
# By default pyrefly also honours mypy's `# type: ignore` and never reports one unused, which would
# hide its own findings and leave `types-api`'s expected errors unchecked.
enabled-ignores = ["pyrefly"]
project-includes = [
    "funcparserlib",
    "examples",
]
