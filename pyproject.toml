[build-system]
requires = ["uv_build >=0.9.10, <0.14"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://funcparserlib.pirx.ru"
Documentation = "https://funcparserlib.pirx.ru"
Repository = "https://github.com/vlasovskikh/funcparserlib"
Changelog = "https://github.com/vlasovskikh/funcparserlib/blob/master/CHANGELOG.md"

[project]
name = "funcparserlib"
version = "2.0.0b1.dev0"
description = "Recursive descent parsing library based on functional combinators"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andrey Vlasovskikh", email = "andrey.vlasovskikh@gmail.com" },
]
keywords = ["parser", "parsing", "combinators", "recursive descent", "lexer"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = [
    { include-group = "tests" },
]
lint = ["deptry >=0.25.1", "slotscheck >=0.19"]
tests = [
    "pytest ~=9.0",
    "pytest-timeout ~=2.3",
]

[tool.uv]
build-backend.module-root = ""
build-backend.module-name = "funcparserlib"

[tool.pytest.ini_options]
timeout = 30
testpaths = ["tests", "funcparserlib", "docs"]
addopts = ["--doctest-modules", "--doctest-glob=*.md"]
filterwarnings = ["error"]

[tool.interrogate]
fail-under = 30

[tool.ruff]
extend = "shared.ruff.toml"

[tool.deptry]
known_first_party = ["funcparserlib"]

[tool.slotscheck]
strict-imports = true
require-superclass = true
