[build-system]
requires = ["uv_build >=0.9.10, <0.14"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://funcparserlib.pirx.ru"
Documentation = "https://funcparserlib.pirx.ru"
Repository = "https://github.com/vlasovskikh/funcparserlib"
Changelog = "https://github.com/vlasovskikh/funcparserlib/blob/master/CHANGELOG.md"

[project]
name = "funcparserlib"
version = "2.0.0b1.dev0"
description = "Recursive descent parsing library based on functional combinators"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andrey Vlasovskikh", email = "andrey.vlasovskikh@gmail.com" },
    { name = "Alexey Shokov", email = "alexey@shokov.dev" },
]
keywords = ["parser", "parsing", "combinators", "recursive descent", "lexer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = [
    { include-group = "tests" },
    { include-group = "examples" },
]
# Libraries whose token streams the examples read, and msgpack, which `msgpack_format.py` is checked
# against.
examples = ["markdown-it-py ~=4.0", "msgpack ~=1.1", "ruamel.yaml ~=0.19"]
bench = [
    # The parsing libraries `bench_comparison.py` measures against.
    "lark ~=1.3",
    "msgpack ~=1.1",
    "orjson ~=3.11",
    "parsy ~=2.2",
    "pyparsing ~=3.3",
    "pytest-benchmark ~=5.2",
]
lint = ["deptry >=0.25.1", "slotscheck >=0.19"]
mutation = ["mutmut ~=3.8"]
tests = [
    "coverage[toml] ~=7.6",
    "hypothesis ~=6.169",
    "pytest ~=9.0",
    "pytest-cov ~=7.0",
    "pytest-timeout ~=2.3",
    "pytest-xdist ~=3.8",
    "setproctitle ~=1.3",
]

[tool.uv]
build-backend.module-root = ""
build-backend.module-name = "funcparserlib"
# So a packager can run the tests from the sdist.
build-backend.source-include = [
    "CHANGELOG.md",
    "conftest.py",
    "docs/**",
    "examples/**",
    "tests/**",
    "typing_tests/**",
]

[tool.pytest.ini_options]
timeout = 30
testpaths = ["tests", "funcparserlib", "docs", "README.md"]
# `-p no:benchmark`: pytest-benchmark, installed for the micro-benchmarks, creates `.benchmarks/`.
addopts = ["--doctest-modules", "--doctest-glob=*.md", "-p", "no:benchmark", "-m", "not exhaustive"]
markers = [
    "interpreted_only: left alone by `tests.shadow`: it counts calls, or differs on purpose",
    "exhaustive: every small grammar, a session of its own in the noxfile",
    "examples: imports the examples, so it is skipped below their Python (conftest.py)",
]
filterwarnings = ["error"]

# The two deselected tests sit near the recursion limit, which mutmut's wrappers push past.
[tool.mutmut]
paths_to_mutate = [
    "funcparserlib/lexer.py",
    "funcparserlib/parser.py",
    "funcparserlib/binary.py",
    "funcparserlib/_compile.py",
]
also_copy = [
    "examples",
    "tests",
    "funcparserlib/__init__.py",
    "funcparserlib/_commons.py",
    "funcparserlib/_version.py",
    "funcparserlib/util.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_text.py",
    "tests/test_binary.py",
    "tests/test_compile.py",
    "tests/test_lexer.py",
]
pytest_add_cli_args = [
    "--deselect",
    "tests/test_compile.py::test_a_long_sequence_compiles[400]",
    "--deselect",
    "tests/test_compile.py::test_deeply_nested_options_compile",
]

[tool.coverage.run]
source = ["funcparserlib"]
branch = true
relative_files = true

[tool.coverage.report]
# A regression floor, not a target.
fail_under = 85
show_missing = true
skip_covered = false
precision = 2
exclude_also = [
    "if (typing\\.)?TYPE_CHECKING:",
    "@(typing\\.)?overload",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

[tool.interrogate]
fail-under = 30

[tool.ruff]
extend = "shared.ruff.toml"
# The examples, the docs and the README use 3.12 syntax; the type checkers read this too, and
# `conftest.py` leaves them out below 3.12 (ADR 0001).
per-file-target-version = { "examples/**" = "py312" }

[tool.deptry]
known_first_party = ["funcparserlib"]

[tool.slotscheck]
strict-imports = true
require-superclass = true

# A token spec has one pattern.
[tool.conventions.messages]
singular = ["pattern"]

# Exported classes that may be subclassed, each with the reason. Everything else exported is
# `@final`.
[tool.conventions.subclassable]
"funcparserlib.parser.Parser" = """The root of every parser: `ForwardDeclParser`, \
`IgnoredParser` and the `TupleNParser` sequence types subclass it. A user's subclass may add \
to a parser; what a parser reads comes from a parsing function (ADR 0006)."""
