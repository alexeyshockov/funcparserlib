[project]
site_name = "funcparserlib"
site_description = "Recursive descent parsing library for Python based on functional combinators."
site_url = "https://funcparserlib.pirx.ru/"
repo_url = "https://github.com/vlasovskikh/funcparserlib"
repo_name = "vlasovskikh/funcparserlib"
edit_uri = "edit/master/docs/"

docs_dir = "docs"
extra_css = ["media/extra.css"]

# `getting-started/` and `api/` keep the paths the published site has had since 1.0, so links into
# funcparserlib.pirx.ru keep working; CONVENTIONS.md would name them `guide/` and `reference/`.
nav = [
    { "Home" = "index.md" },
    { "Getting Started" = [
        { "Intro" = "getting-started/index.md" },
        { "Tokenizing Input" = "getting-started/tokenizing.md" },
        { "Parsing Tokens" = "getting-started/parsing.md" },
        { "Preparing the Parse Tree" = "getting-started/parse-tree.md" },
        { "Tips and Tricks" = "getting-started/tips-and-tricks.md" },
    ] },
    { "API Reference" = [
        { "API Overview" = "api/index.md" },
        { "Lexer" = "api/lexer.md" },
        { "Parser" = "api/parser.md" },
        { "Utilities" = "api/util.md" },
    ] },
    { "Recipes" = [
        { "Parsing Markdown with markdown-it" = "recipes/markdown.md" },
    ] },
    { "Glossary" = "explanation/glossary.md" },
    { "Decisions (ADR)" = "adr/index.md" },
    { "Changelog" = "changes.md" },
]

[project.theme]
features = [
    "navigation.expand",
    "navigation.tabs",
    "navigation.top",
    "content.code.copy",
    "content.action.edit",
    "search.suggest",
    "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python.options]
extensions = ["tools/griffe_refclass.py:RefclassExtension"]
docstring_style = "google"
show_root_toc_entry = false
show_root_heading = true
heading_level = 3
show_source = false
members = false

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions."pymdownx.highlight"]
[project.markdown_extensions."pymdownx.superfences"]
[project.markdown_extensions."pymdownx.snippets"]
check_paths = true

[project.markdown_extensions."pymdownx.blocks.admonition"]
