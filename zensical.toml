[project]
site_name = "funcparserlib"
site_description = "Recursive descent parsing library for Python based on functional combinators."
site_url = "https://funcparserlib.pirx.ru/"
repo_url = "https://github.com/vlasovskikh/funcparserlib"
repo_name = "vlasovskikh/funcparserlib"
edit_uri = "edit/master/docs/"

# A warning (a broken link, a docstring griffe cannot parse) fails the build.
strict = true

docs_dir = "docs"
extra_css = ["media/extra.css"]

# `getting-started/` and `api/` keep the paths the published site has had since 1.0, so links into
# funcparserlib.pirx.ru keep working; CONVENTIONS.md would name them `guide/` and `reference/`.
nav = [
    { "Home" = "index.md" },
    { "Getting Started" = [
        { "Intro" = "getting-started/index.md" },
        { "Tokenizing Input" = "getting-started/tokenizing.md" },
        { "Parsing Tokens" = "getting-started/parsing.md" },
        { "Preparing the Parse Tree" = "getting-started/parse-tree.md" },
        { "Tips and Tricks" = "getting-started/tips-and-tricks.md" },
    ] },
    { "Guides" = [
        { "Error Handling" = "guide/errors.md" },
        { "Debugging a Grammar" = "guide/debugging.md" },
        { "Performance" = "guide/performance.md" },
        { "Parsing Without a Tokenizer" = "guide/without-a-tokenizer.md" },
        { "Positions and Matches" = "guide/positions-and-matches.md" },
        { "Other Libraries" = "guide/other-libraries.md" },
    ] },
    { "Recipes" = [
        { "Overview" = "recipes/index.md" },
        { "External Tokenizers" = [
            { "Parsing Markdown with markdown-it" = "recipes/markdown.md" },
            { "Parsing YAML with ruamel.yaml" = "recipes/yaml.md" },
        ] },
        { "Binary Data" = [
            { "Parsing MessagePack" = "recipes/msgpack.md" },
        ] },
        { "Rules of a Format" = [
            { "Checking a Changelog" = "recipes/changelog.md" },
            { "Checking Decision Records" = "recipes/adr.md" },
        ] },
        { "Rewriting a Text" = [
            { "Migrating a File Format" = "recipes/migration.md" },
        ] },
        { "Web Formats" = [
            { "Parsing URIs" = "recipes/uri.md" },
            { "Parsing HTTP Headers" = "recipes/http-headers.md" },
            { "Parsing Structured Fields" = "recipes/structured-fields.md" },
        ] },
        { "Parsing KDL" = "recipes/kdl.md" },
    ] },
    { "API Reference" = [
        { "API Overview" = "api/index.md" },
        { "Lexer" = "api/lexer.md" },
        { "Binary (experimental)" = "api/binary.md" },
        { "Parser" = "api/parser.md" },
        { "Utilities" = "api/util.md" },
    ] },
    { "Changelog" = "changes.md" },
]

[project.theme]
variant = "classic"
features = [
    "navigation.expand",
    "navigation.tabs",
    "navigation.top",
    "content.code.copy",
    "content.action.edit",
    "search.suggest",
    "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"
toggle.icon = "material/weather-night"
toggle.name = "Switch to light mode"

[project.plugins.search]

# `llms.txt`, an index of the site for language models, and `llms-full.txt`, every page in one
# file; each page is also published as Markdown beside its HTML. The guides first and the API
# reference after; the ADRs under "Optional", the spec's skippable part.
[project.plugins.llmstxt]
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"funcparserlib" = [
    "index.md",
    "getting-started/*.md",
    "guide/*.md",
    "recipes/*.md",
    "explanation/*.md",
]
"API" = ["api/*.md"]
"Optional" = ["adr/index.md", "adr/0*.md", "changes.md"]

[project.plugins.mkdocstrings.handlers.python.options]
extensions = ["tools/griffe_refclass.py:RefclassExtension"]
# The `__init__` of a dataclass is generated and has no docstring; the class docstring and the
# signature describe the construction.
filters = ["!^_[^_]", "!^__init__$"]
docstring_style = "google"
show_root_toc_entry = false
show_root_heading = true
heading_level = 3
show_source = false
show_signature_annotations = true
separate_signature = true
members = false

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions."pymdownx.highlight"]
[project.markdown_extensions."pymdownx.superfences"]
[project.markdown_extensions."pymdownx.snippets"]
check_paths = true

[project.markdown_extensions."pymdownx.blocks.admonition"]

# Inline code naming an API object links to its reference entry (`tools/mdautolink`).
# `modules` is spelled out because the index reads a module's exports, and the pages render the
# lexer's and util's objects one by one, never the modules themselves.
[project.markdown_extensions.mdautolink]
modules = ["funcparserlib.lexer", "funcparserlib.parser", "funcparserlib.util"]
