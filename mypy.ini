# Generated above the marker near the end; propose changes there in an issue. The project's own
# `[mypy-<module>]` sections go below the marker.
#
# mypy has no extend mechanism and reads `mypy.ini` first, so there is no `[tool.mypy]` in
# `pyproject.toml` (the conventions runner, CON800, refuses the pair).
# Comments sit on their own lines: an inline `# ...` becomes part of the value.
[mypy]
# No `python_version`: the recipes pass `--python-version` from `requires-python` and run a file
# ruff's `per-file-target-version` pins apart, at its version. mypy run outside them checks as the
# interpreter it runs under.
strict = True
files = funcparserlib, examples
# The one opt-out from `strict`: annotation presence on the public API is `just type-coverage`.
# A project that has to lag on another knob relaxes it per module below the marker, with the reason.
disallow_untyped_defs = False
# A variable may take a different type in another branch.
allow_redefinition_new = True
# Beyond `strict`: a `match` with an unhandled arm, a name bound on one branch only, an always-true
# condition, a truthiness test on an object without `__bool__`, and codes that lock a rule in.
enable_error_code = exhaustive-match, possibly-undefined, redundant-expr, truthy-bool, truthy-iterable, ignore-without-code, mutable-override, unimported-reveal, deprecated

# Example helpers may be loosely typed; the examples are run and checked against the API.
[mypy-examples.*]
disallow_any_generics = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_decorators = False

# Tests and benchmarks are checked for what they call on the package; checks that make one harder
# to read (unannotated fixtures and helpers, bare generics, `Any` from `request.param` or
# `json.loads()`, `seen.append(v) or v`, a partial `match` in a fake server) are off. A directory
# that is no package names its modules in a section of the project's own.
[mypy-tests.*,benchmarks.*]
disallow_any_generics = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_decorators = False
warn_return_any = False
strict_equality = False
disable_error_code = func-returns-value, redundant-expr, exhaustive-match

# --- The project's own, below: per-module sections for libraries that ship no types. ---

# msgpack and parsy, which the examples' tests and the benchmarks compare against, ship no types.
[mypy-msgpack.*,parsy.*]
ignore_missing_imports = True
