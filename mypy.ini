# mypy's configuration. Generated above the marker near the end; propose changes there in an issue.
# The project's own `[mypy-<module>]` sections go at the bottom, below the marker.
#
# `mypy.ini` and not `[tool.mypy]`: mypy has no extend mechanism and reads exactly one file, this
# name first. So the section must not exist in `pyproject.toml` — the conventions runner (CON800)
# refuses the pair — and editors discover this file on their own.
#
# INI, so comments sit on their own lines. An inline `# ...` becomes part of the value: a bad
# `python_version` is reported as a note, and mypy goes on checking as the running interpreter.
[mypy]
# No `python_version`: the recipes pass `--python-version` from `requires-python`, the one place the
# floor is stated, and run a file ruff's `per-file-target-version` pins apart, at its version. mypy
# run outside them checks as the interpreter it runs under.
strict = True
files = funcparserlib, examples
# The one opt-out from `strict`, and it is policy rather than debt: the gate is over the package's
# correctness, not a demand for annotations on every internal `def` — presence on the public API is
# pyrefly's question (`just type-coverage`). Everything else `strict` implies is on, including
# `disallow_incomplete_defs`: a `def` that annotates some parameters and not others looks typed and
# is not, which is the blind spot this half of the pair closes. A project that has to lag on a knob
# relaxes it per module below the marker, with the reason, so the debt is visible where the config is.
disallow_untyped_defs = False
# A variable may take a different type in the other branch (of a sync/async pair, say); the
# checker follows that rather than the code renaming one side.
allow_redefinition_new = True
# Beyond `strict`: the codes that found real defects when measured across the workspace (a `match`
# with an unhandled arm, a name bound on one branch only, an always-true condition, a truthiness
# test on an object without `__bool__`), plus five that cost nothing and lock a rule in. Not
# `explicit-override` (a style demand) and not `unused-awaitable` (every hit was a fire-and-forget
# task handle — an API question, not a checker's).
enable_error_code = exhaustive-match, possibly-undefined, redundant-expr, truthy-bool, truthy-iterable, ignore-without-code, mutable-override, unimported-reveal, deprecated

# An example's helpers are the example's business: `-> dict` is fine, and so is a helper without
# every parameter annotated, or a call to one. They are checked for running, in the suite, and for
# being true to the API, which is what a reader takes from them.
[mypy-examples.*]
disallow_any_generics = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_decorators = False

# Tests and benchmarks are checked at the examples' depth: a fixture parameter or a helper may go
# unannotated, and a generic bare. What they call on the package is checked in full. A test or
# benchmark directory that is no package names its modules in a section of the project's own.
[mypy-tests.*,benchmarks.*]
disallow_any_generics = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_decorators = False

# --- The project's own, below: per-module sections for libraries that ship no types. ---

# msgpack and parsy, which the examples' tests and the benchmarks compare against, ship no types.
[mypy-msgpack.*,parsy.*]
ignore_missing_imports = True
