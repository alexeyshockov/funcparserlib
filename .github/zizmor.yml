# Generated; propose changes in an issue rather than editing this file.
#
# unpinned-uses: a version or ref pin (@v6, @release/v1) is accepted for the orgs listed, and any
# other action needs a full commit SHA.
rules:
  unpinned-uses:
    config:
      policies:
        "actions/*": ref-pin
        "astral-sh/*": ref-pin
        "pypa/*": ref-pin
        "SonarSource/*": ref-pin
        # `extractions/setup-just`: every workflow installs just.
        "extractions/*": ref-pin
        "*": hash-pin
