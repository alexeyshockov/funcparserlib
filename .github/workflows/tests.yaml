# The CI test matrix.
# Generated; propose changes in an issue rather than editing this file.
#
# The noxfile's sessions tagged `ci` (`just tools::ci-matrix`) are the matrix, one job each.
name: tests

on:
  workflow_call:
    inputs:
      artifacts:
        description: Artifacts downloaded into `dist/` before each session (a name pattern); empty for none
        type: string
        default: ""

permissions: {}

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sessions: ${{ steps.list.outputs.sessions }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - id: list
        run: echo "sessions=$(just tools::ci-matrix)" >> "$GITHUB_OUTPUT"

  session:
    needs: matrix
    name: ${{ matrix.session }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.sessions) }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - if: inputs.artifacts != ''
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifacts }}
          path: dist
          merge-multiple: true
      - run: just tools::nox --session "$SESSION"
        env:
          SESSION: ${{ matrix.session }}
          # A session that reads it installs the built distribution from `dist/`.
          ARTIFACTS_DIR: ${{ inputs.artifacts != '' && 'dist' || '' }}
