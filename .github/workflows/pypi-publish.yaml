name: Publish to PyPI

# A published release `vX.Y.Z` ships the commit its tag names, whose tree holds X.Y.Z.devN; the
# build job writes X.Y.Z into its own checkout and builds it. Nothing is pushed back.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    # `./` is this repository at the release's commit.
    uses: ./.github/workflows/tests.yaml # zizmor: ignore[self-repository]

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # No cache on the path to a release: a cache written by a PR run must not reach the
          # artifacts (zizmor cache-poisoning). setup-uv defaults to "auto".
          enable-cache: false
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - run: just tools::run conventions release "$TAG" --write
        env:
          TAG: ${{ github.event.release.tag_name }}
      # The tag without its `v`, for the environment's link.
      - id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - run: uv build --all-packages --no-sources
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/funcparserlib/${{ needs.build.outputs.version }}
    permissions:
      contents: read
      # PyPI trusted publishing and Sigstore-signed PEP 740 attestations
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # `uv publish` only uploads existing attestations; this action generates them. Track
      # astral-sh/uv#15618.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
