name: coverage comment

# Posts the coverage comment stored by `ci.yaml` for a fork's pull request, with the base
# repository's write token. It reads one text artifact and never checks out or runs pull-request
# code, which is why the `workflow_run` trigger is safe here.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      pull-requests: write
      actions: read
    steps:
      - uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: post_comment
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}
