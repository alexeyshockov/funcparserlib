name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The commit hooks run on pre-commit.ci. The jobs here need the project importable or a specific
# interpreter; CON700 holds the `gate` job to `just gate`'s dependency list.
jobs:
  # Everything `just gate` runs, one step per recipe, in the gate's order.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The release tags: the conventions runner holds the tree's version above the newest
          # one (CON413) and gives no verdict on a clone without them (CON414).
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - run: uv sync --all-groups --all-extras
      - name: conventions
        run: just conventions
      - name: import-linter
        run: just imports
      - name: deptry
        run: just deps
      - name: slotscheck
        run: just slots
      - name: type check the package, the examples, the tests and the benchmarks (mypy)
        run: just types
      - name: type completeness (pyrefly coverage)
        run: just type-coverage
      - name: typing tests (mypy, ty, pyrefly, basedpyright)
        run: just types-api
      - name: type check the checks (mypy)
        run: just tools::types
      # Second opinions from ty, pyrefly and basedpyright; the recipe never fails.
      - name: ty, pyrefly and basedpyright (informational)
        run: just types-info

  tests:
    uses: ./.github/workflows/tests.yaml # zizmor: ignore[self-repository]

  # On `master` writes the badge and data to an orphan branch; on a pull request posts a comment.
  # `fail_under` in `pyproject.toml` is the gate; the thresholds here only colour the badge.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0
      - name: pytest with coverage
        run: just coverage
      - name: coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVITY: ${{ github.event_name == 'push' && 'save_coverage_data_files' || 'process_pr' }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 80
      # A fork's pull request has no write permission; `coverage-comment.yaml` posts the stored text.
      - name: store coverage comment for fork pull requests
        if: steps.coverage_comment.outputs.comment_file_written == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt

  # The one required status check. It fails unless every job it needs succeeded; GitHub reports a
  # job skipped by a failed dependency as passed.
  ci:
    needs: [gate, tests, coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: test "$NOT_ALL_PASSED" = false
        env:
          NOT_ALL_PASSED: >-
            ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped') }}
