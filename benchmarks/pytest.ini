# Passed with `-c` by `just bench::micro`. Generated; propose changes in an issue rather than
# editing this file.
#
# `importlib` imports each `benchmarks/` directory by path, so several distributions run in one
# session. Paths are relative to the repository root.
[pytest]
addopts =
    --benchmark-only
    --import-mode=importlib
    --benchmark-storage=file://benchmarks/results
    --benchmark-autosave
python_files = bench_*.py
python_functions = bench_*
