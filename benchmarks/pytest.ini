# The micro-benchmarks' pytest configuration, apart from every test suite's: `just bench::micro`
# passes it with `-c`. Generated; propose changes in an issue rather than editing this file.
#
# `importlib` imports each `benchmarks/` directory by its path, so the directories of several
# distributions run in one session. Paths are relative to the repository root, where the recipe
# runs.
[pytest]
addopts =
    --benchmark-only
    --import-mode=importlib
    --benchmark-storage=file://benchmarks/results
    --benchmark-autosave
python_files = bench_*.py
python_functions = bench_*
