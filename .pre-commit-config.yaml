# Generated; propose changes in an issue rather than editing this file.
# Run by prek (`just check`) and by pre-commit.ci, which also reads `ci:`; prek ignores it.
#
# The `pre-commit` stage is the gate and is read-only: prek detects a rewrite by diffing the
# worktree against the index, so a write-mode hook on a file the index has never seen rewrites
# it and still reports Passed. Each fixing tool has a second, write-mode hook at the `manual`
# stage, which only `just fix` runs.
# `stages:` is spelled out on every gate hook: a hook whose upstream manifest declares `stages`
# (`typos`, `check-added-large-files`) ignores `default_stages`.
minimum_pre_commit_version: "3.5.0"
default_stages: [pre-commit]

ci:
  # pre-commit.ci cannot disable its autoupdate; this branch does not exist, so it opens no PR.
  autoupdate_branch: pre-commit-ci-autoupdate
  autoupdate_schedule: quarterly

repos:
  # Docstring layout only (comments and Markdown fences are off); ruff's `D` and `DOC` rules own
  # what a docstring says. Settings are arguments, so no `[tool.pydocfmt]`.
  # `tools/`, `_commons.py` and `noxfile.py` are judged at 100 columns. The width is inline
  # `--config` because `--line-length` outranks `per-file-settings`.
  # A one-line summary within three columns of the width keeps its closing quotes on their own
  # line here (PDF109) and on the summary line under ruff format; shorten the summary (ruff E501
  # names it). A code span split across lines is reported without a fix; join it by hand.
  - repo: https://github.com/pallgeuer/pydocformatter
    rev: v1.2.1
    hooks:
      # Findings rather than `--diff`, which counts a finding the fixer cannot apply without
      # saying where it is.
      - id: pydocfmt-check
        # `--no-cache`: the cache is a directory in the repository. `--parallelism=1`: prek
        # already runs file batches in parallel.
        args: &pydocfmt_args
          - --no-cache
          - --parallelism=1
          - --docstring-convention=google
          - >-
            --config=select = ["PDF000", "PDF001", "PDF100", "PDF101", "PDF102", "PDF103", "PDF104",
            "PDF105", "PDF109", "PDF110", "PDF200", "PDF201", "PDF204", "PDF208", "PDF211"]
          - "--config=line-length = 100"
          - >-
            --config=per-file-settings = { "tools/**" = { line-length = 100 },
            "**/_commons.py" = { line-length = 100 }, "noxfile.py" = { line-length = 100 } }
        types_or: &pydocfmt_types [python, pyi]
        stages: [pre-commit]
      - id: pydocfmt-fix
        args: *pydocfmt_args
        types_or: *pydocfmt_types
        stages: [manual]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # `ruff check` is read-only without `--fix`.
      - id: ruff-check
        args: []
        stages: [pre-commit]
      - id: ruff-format
        args: [--check]
        stages: [pre-commit]
        # Without `markdown`, which the hook's current default adds: ruff would reformat
        # fenced examples that are hand-aligned fragments, changing what a line says.
        types_or: &py_only [python, pyi, jupyter]
      - id: ruff-check
        alias: ruff-check-fix
        name: ruff check (fix)
        args: [--fix]
        stages: [manual]
      - id: ruff-format
        alias: ruff-format-fix
        name: ruff format (fix)
        stages: [manual]
        types_or: *py_only

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        stages: [pre-commit]
        exclude: ^tools/
        # The floor is `[tool.interrogate] fail-under` in pyproject.toml, a regression floor.
        # `--config` names the root's: without it interrogate walks up from the first path, and a
        # nearer `pyproject.toml` with no `[tool.interrogate]` (the toolbox's, a workspace
        # member's) silences the floor and the built-in 80% applies.
        args:
          - --config=pyproject.toml
          - funcparserlib

  # A concrete tag, not upstream's moving `v1`, which `pre-commit autoupdate` prefers.
  # Bump with `shared_frozen_revs` in shared.just; `just smoke` fails while they disagree.
  - repo: https://github.com/crate-ci/typos
    rev: v1.50.3
    hooks:
      # The manifest default `--write-changes` is dropped for the gate.
      - id: typos
        args: [--force-exclude]
        stages: [pre-commit]
        # Files a fixing hook must not rewrite: lockfiles and recorded or vendored bytes
        # (`preserve_bytes`).
        exclude: &do_not_rewrite |-
          (?x)^(
            uv\.lock
          )
      - id: typos
        alias: typos-fix
        name: typos (fix)
        stages: [manual]
        exclude: *do_not_rewrite

  # Whitespace, line endings and encoding, checked against `.editorconfig`. It is the gate for
  # `trailing-whitespace` and `mixed-line-ending`, which have no useful check mode and stay
  # below as fix-only. There is no final-newline fixer: `end-of-file-fixer` also trims blank
  # lines, which `insert_final_newline` allows, so `just fix` would rewrite what `just check`
  # passes.
  #
  # Line length and indent size: ruff checks Python, markdownlint checks Markdown, and the
  # second run below checks TOML, JSON, shell and YAML. Markdown has no indent-size check: its
  # renderer and markdownlint's MD007 need nested bullets at an indent of 4.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.11.1
    hooks:
      - id: editorconfig-checker
        args: [-disable-indent-size, -disable-max-line-length]
        stages: [pre-commit]
        exclude: *do_not_rewrite
      - id: editorconfig-checker
        alias: editorconfig-checker-layout
        name: editorconfig-checker (line length, indent size)
        args:
          - -disable-end-of-line
          - -disable-insert-final-newline
          - -disable-trim-trailing-whitespace
        stages: [pre-commit]
        files: \.(toml|json|sh|ya?ml)$
        exclude: *do_not_rewrite

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
        exclude: *do_not_rewrite
      # Fix-only: editorconfig-checker is their gate.
      - id: trailing-whitespace
        stages: [manual]
        exclude: *do_not_rewrite
      - id: mixed-line-ending
        args: [--fix=lf]
        stages: [manual]
        exclude: *do_not_rewrite

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.22
    hooks:
      - id: uv-lock
        args: [--check]
        stages: [pre-commit]
      - id: uv-lock
        alias: uv-lock-fix
        name: uv-lock (fix)
        args: []
        stages: [manual]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        stages: [pre-commit]

  # Config in .github/zizmor.yml. Offline on pre-commit.ci, so online-only audits are skipped there.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        stages: [pre-commit]

  # YAML formatter, reading `.editorconfig`. The gate overrides `entry` because the hook bakes
  # `--write` into it, so `args: [--check]` would still rewrite the file.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.9
    hooks:
      - id: prettier
        entry: prettier --check --ignore-unknown
        stages: [pre-commit]
        types_or: &yaml_only [yaml]
      - id: prettier
        alias: prettier-fix
        name: prettier (fix)
        stages: [manual]
        types_or: *yaml_only

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        stages: [pre-commit]
        # `openspec/` is machine-written. A project's own machine-written paths go in its
        # `.markdownlint-cli2.jsonc` `ignores`; a `.markdownlintignore` is not applied to the
        # paths pre-commit passes explicitly.
        exclude: &openspec ^openspec/
      - id: markdownlint-cli2
        alias: markdownlint-cli2-fix
        name: markdownlint-cli2 (fix)
        args: [--fix]
        stages: [manual]
        exclude: *openspec
