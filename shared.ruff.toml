# Ruff's lint and format configuration.
# Generated; propose changes in an issue rather than editing this file.
#
# Reached through `[tool.ruff] extend = "shared.ruff.toml"` in `pyproject.toml`; the name avoids
# `ruff.toml`, which ruff would discover and let shadow `[tool.ruff]`. A project adds with
# `extend-select`, `extend-ignore` and `extend-per-file-ignores`; the bare keys replace this file's
# lists, and the conventions runner (CON803) refuses them.

line-length = 100
# `# noqa` comments are written with codes, so diagnostics print codes.
output-prefer-rule-codes = true

[format]
docstring-code-format = true
# Layout follows the width alone; otherwise a trailing comma keeps a list one item per line.
skip-magic-trailing-comma = true

[lint]
# The DOC1xx/2xx/4xx rules (pydoclint port) and PLC2701 are preview-only. `explicit-preview-rules`
# enables only the preview codes named in `select`; prefix selectors (F, PL, RUF, ...) stay stable.
preview = true
explicit-preview-rules = true
select = [
    "F",  # pyflakes
    "E", "W",  # pycodestyle
    "I",  # isort
    "Q",  # flake8-quotes
    "UP",  # pyupgrade
    "YTT",  # flake8-2020
    # "ANN" is covered by mypy.
    "ASYNC",  # flake8-async
    "S",  # flake8-bandit
    "BLE",  # flake8-blind-except
    "B",  # flake8-bugbear
    "A",  # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "EXE",  # flake8-executable
    "FA",  # flake8-future-annotations
    # Causes a warning: https://github.com/astral-sh/ruff/issues/8272
    "ISC",  # flake8-implicit-str-concat
    "G",  # flake8-logging-format
    "INP",  # flake8-no-pep420
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "PT",  # flake8-pytest-style
    # The rest of RET worsens readability.
    "RET501", "RET502", "RET503",  # flake8-return
    "SLOT",  # flake8-slots
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    # flake8-type-checking: only the codes that do not move runtime imports into `if TYPE_CHECKING:`
    # (TC001/002/003).
    "TC006",  # runtime-cast-value — quote the type expression in `typing.cast()` (dead at runtime)
    "TC008",  # quoted-type-alias — drop needless quotes from a `type X = ...` alias (RHS is lazy)
    "PTH",  # flake8-use-pathlib
    "PGH",  # pygrep-hooks
    "PL",  # Pylint
    # Preview. Flags imports of `_*` names from another package, which SLF001 and the type
    # checkers do not; tests and benchmarks are exempted below.
    "PLC2701",  # Private name import from an external module
    "TRY",  # tryceratops
    "PERF",  # Perflint
    "LOG",  # flake8-logging
    "RUF",  # Ruff-specific
    # pydoclint port (preview): a docstring documenting a parameter, return or yield the signature
    # lacks. The `missing-*` rules (DOC201/402/501) would demand documenting every return, yield and
    # raise; DOC502 false-positives on indirectly raised exceptions.
    "DOC102",  # docstring-extraneous-parameter
    "DOC202",  # docstring-extraneous-returns
    "DOC403",  # docstring-extraneous-yields
]
ignore = [
    "ASYNC109",  # Async function definition with a `timeout` parameter
    # `__all__` is grouped by hand.
    "RUF022",
    "PGH003", "PGH004",  # Use specific rule codes when ignoring type issues
    "RUF005",  # Consider unpacking instead of concatenation
    # `try`/`except` in a loop reads better than the micro-cost it avoids.
    "PERF203",
    "S101",  # Use of `assert` detected
    "S311",  # Standard pseudo-random generators are not suitable for cryptographic purposes
    "B011",  # Do not `assert False`
    "SIM105",  # Use `contextlib.suppress(...)` instead of `try`-`except`-`pass`
    # Use a single `with` statement with multiple contexts
    "SIM117",
    "PLR0913",  # Too many arguments in function definition
    "PLR2004",  # Magic value used in comparison
    # Too many false positives:
    "PLW2901",  # ... loop variable ... overwritten by assignment target
    "TRY003",  # Avoid specifying long messages outside the exception class
    "TRY400",  # Use `logging.exception` instead of `logging.error`
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
    # `TypeVar` name does not reflect its variance: a module-level type variable stands in for PEP
    # 695 syntax, which infers variance and has no suffix.
    "PLC0105",
]

# A project's own paths go in `extend-per-file-ignores`; a path named in both gets the union.
[lint.per-file-ignores]
# Tests import lazily (optional extras) and test internals.
"**/tests/**" = ["PLC0415", "PLC2701"]
# Runnable programs print their result.
"examples/*" = ["T201"]
# Benchmarks time internal primitives.
"**/benchmarks/**" = ["T201", "PLC2701"]
# The generated `_commons.py` spells generics with `TypeVar` to run on the oldest supported Python.
"funcparserlib/_commons.py" = ["UP047"]

[lint.isort]
# Pairs with `skip-magic-trailing-comma`.
split-on-trailing-comma = false

[lint.pydocstyle]
convention = "google"

[lint.pylint]
# PLR0917's default of 5 is too tight for private helpers called through APIs that pass arguments
# positionally (`anyio.to_thread.run_sync`).
max-positional-args = 8

[lint.pyupgrade]
keep-runtime-typing = true
